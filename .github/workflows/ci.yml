name: Millennium Prize Problems Lean 4 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-lean4:
    name: Verify Millennium Lean 4 Proofs (0 sorry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Elan (Lean 4 Toolchain Manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Check Lean 4 & Lake version
        working-directory: test_lean
        run: |
          elan which lean
          lake --version

      - name: Build Mathlib Cache
        working-directory: test_lean
        run: |
          cp .lake/packages/mathlib/lean-toolchain ./lean-toolchain || true
          lake exe cache get || true

      - name: Verify Millennium Formal Proofs
        working-directory: test_lean
        run: |
          lake env lean RiemannMotivicFrobenius.lean
          lake env lean RiemannSpectralPurity.lean
          lake env lean PvsNPQuiverEntropy.lean
          lake env lean NavierStokesEnstrophy.lean
          lake env lean BSDSpecialValue.lean
          lake env lean HodgeRationalCycles.lean
          lake env lean YangMillsSpectralGap.lean

  automerge:
    name: Auto-merge Verified PR
    needs: verify-lean4
    if: github.event_name == 'pull_request' && (github.actor == 'charlesen' || github.actor == 'flouzzy' || endsWith(github.actor, '[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR via GitHub CLI
        run: |
          echo "Merging pull request #${{ github.event.pull_request.number }} into main..."
          gh pr merge "${{ github.event.pull_request.number }}" --merge --admin || gh pr merge "${{ github.event.pull_request.number }}" --merge --auto || gh pr merge "${{ github.event.pull_request.number }}" --merge || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
